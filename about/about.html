<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us - Team</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    .about-section {
      text-align: center;
      padding: 50px 20px;
    }

    /* Logo Kampus */
    .about-section .logo {
      width: 120px;
      height: auto;
      margin-bottom: 20px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .about-section .logo:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .about-section h2 {
      font-size: 2.5em;
      margin-bottom: 40px;
      color: #333;
    }

    .team-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .team-member {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .team-member:hover {
      transform: translateY(-10px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .team-member img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .team-info {
      padding: 15px;
    }

    .team-info h3 {
      margin: 0;
      font-size: 1.2em;
      color: #222;
    }

    .team-info p {
      font-size: 0.95em;
      color: #555;
    }

    /* Animasi fade-in */
    .team-member {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s forwards;
    }

    .team-member:nth-child(1) { animation-delay: 0.2s; }
    .team-member:nth-child(2) { animation-delay: 0.4s; }
    .team-member:nth-child(3) { animation-delay: 0.6s; }
    .team-member:nth-child(4) { animation-delay: 0.8s; }
    .team-member:nth-child(5) { animation-delay: 1s; }
    .team-member:nth-child(6) { animation-delay: 1.2s; }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <section class="about-section">
    <!-- Logo Kampus -->
    <img class="logo" src="https://tse2.mm.bing.net/th/id/OIP.6OyzJ5x9Zx0aTNoYRfKSBwHaFj?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Logo Kampus" />
      <h3 sytle="text-align:center">Universitas Indaraprasta PGRI</h3>
    
    <h2>Meet Our Team</h2>
    <div class="team-container">
      <div class="team-member">
        <img src="https://via.placeholder.com/200x200" alt="Member 1">
        <div class="team-info">
          <h3>Thariq</h3>
          <p>202443501778</p>
        </div>
      </div>
      <div class="team-member">
        <img src="https://via.placeholder.com/200x200" alt="Member 2">
        <div class="team-info">
          <h3>Atha</h3>
          <p>202443501777</p>
        </div>
      </div>
      <div class="team-member">
        <img src="https://via.placeholder.com/200x200" alt="Member 3">
        <div class="team-info">
          <h3>Adit</h3>
          <p>Backend Developer</p>
        </div>
      </div>
      <div class="team-member">
        <img src="https://via.placeholder.com/200x200" alt="Member 4">
        <div class="team-info">
          <h3>Rifqi</h3>
          <p>UI/UX Designer</p>
        </div>
      </div>
      <div class="team-member">
        <img src="https://via.placeholder.com/200x200" alt="Member 5">
        <div class="team-info">
          <h3>Zaki</h3>
          <p>Researcher</p>
        </div>
      </div>
      <div class="team-member">
        <img src="https://via.placeholder.com/200x200" alt="Member 6">
        <div class="team-info">
          <h3>Rafi</h3>
          <p>Documentation</p>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
