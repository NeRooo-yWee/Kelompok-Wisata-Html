    .about-section .logo {

    .team-member {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .team-member:hover {
      transform: translateY(-10px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    .team-member img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .team-info {
      padding: 15px;
    }
    .team-info h3 {
      margin: 0;
      font-size: 1.2em;
      color: #222;
    }
    .team-info p {
      font-size: 0.95em;
      color: #555;
    }
    /* Animasi fade-in */
    .team-member {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s forwards;
    }
    .team-member:nth-child(1) { animation-delay: 0.2s; }
    .team-member:nth-child(2) { animation-delay: 0.4s; }
    .team-member:nth-child(3) { animation-delay: 0.6s; }
    .team-member:nth-child(4) { animation-delay: 0.8s; }
    .team-member:nth-child(5) { animation-delay: 1s; }
    .team-member:nth-child(6) { animation-delay: 1.2s; }
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
